name: Release

# Every push of a v* tag builds the app and attaches the packages to the
# matching GitHub release. workflow_dispatch rebuilds an existing tag (useful
# when the tag predates this workflow) without touching it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.2.0"
        required: true
        type: string
      publish:
        description: "Attach the packages to that release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build ${{ inputs.tag || github.ref_name }}
    # Ubuntu 22.04 keeps the glibc baseline at 2.35, so the binary runs on
    # Debian 12, Ubuntu 22.04+, openSUSE Leap and Tumbleweed. Building on a
    # newer runner would raise that floor for everyone.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out ${{ env.RELEASE_TAG }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "tag $RELEASE_TAG does not match the crate version $version" >&2
            exit 1
          fi

      # A tag pushed from now on already contains packaging/package.sh. A
      # workflow_dispatch rebuild of an older tag (v0.2.0) does not, so take the
      # packaging tools from the revision the workflow was started from. The
      # binary and the assets still come from the tag itself.
      - name: Provide the packaging scripts for an older tag
        run: |
          if [ -f packaging/package.sh ]; then
            exit 0
          fi
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout FETCH_HEAD -- packaging
          if [ ! -f packaging/package.sh ]; then
            echo "the tag predates packaging/; dispatch the workflow from main" >&2
            exit 1
          fi

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            pkg-config rpm dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RELEASE_TAG }}

      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked

      - name: Package
        run: bash packaging/package.sh --skip-build --formats all

      - name: Upload the workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: legion-monitor-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "Legion Monitor $RELEASE_TAG" \
              --generate-notes
          fi
