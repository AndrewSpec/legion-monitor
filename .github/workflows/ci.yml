name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # winit/eframe need the Wayland/X11/OpenGL headers at link time.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            pkg-config

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --locked --release

      # Keep the packaging script covered on every change; the Release workflow
      # builds the full tarball/.deb/.rpm set on Ubuntu 22.04.
      - name: Package the tarball and the .deb
        run: |
          bash -n packaging/package.sh
          sh -n packaging/install.sh
          bash packaging/package.sh --skip-build --formats tarball,deb
          tar tzf dist/*.tar.gz
          dpkg-deb --info dist/*.deb
