[package]
name = "legion-monitor"
version = "0.3.0"
edition = "2021"
description = "Control a Lenovo Legion R45w-30 monitor (brightness, inputs, PiP/PbP, profiles) over DDC/CI"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/AndrewSpec/legion-monitor"
homepage = "https://github.com/AndrewSpec/legion-monitor"
authors = ["AndrewSpec"]
keywords = ["ddc", "ddcutil", "monitor", "egui", "wayland"]
categories = ["gui", "command-line-utilities"]

[dependencies]
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
